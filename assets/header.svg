<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">CADcoLabs</title>
  <desc id="desc">Industrial blueprint banner for CADcoLabs: fabrication intelligence, CAD automation, and applied AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10253a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#dbe4ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6ca6c1" stroke-width="1" opacity=".12"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 275H1200" stroke="#f59e0b" stroke-width="4"/>

  <g transform="translate(68 66)">
    <text x="0" y="0" fill="#f59e0b" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="4">CAD / DATA / AUTOMATION</text>
    <text x="0" y="78" fill="url(#metal)" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">CADcoLabs</text>
    <rect x="3" y="103" width="84" height="4" rx="2" fill="#f59e0b"/>
    <text x="0" y="148" fill="#b9c9d8" font-family="Segoe UI, Arial, sans-serif" font-size="19" letter-spacing="2">FABRICATION INTELLIGENCE  •  CAD AUTOMATION  •  APPLIED AI</text>
  </g>

  <g transform="translate(890 54)" fill="none" stroke-linejoin="round">
    <path d="M0 52L104 0L208 52L104 105Z" stroke="#dbe4ee" stroke-width="3"/>
    <path d="M0 52V151L104 205V105M208 52V151L104 205" stroke="#7895a8" stroke-width="3"/>
    <path d="M34 69L104 34L174 69L104 105Z" stroke="#f59e0b" stroke-width="3"/>
    <path d="M34 69V126L104 162V105M174 69V126L104 162" stroke="#f59e0b" stroke-width="2" opacity=".75"/>
    <path d="M-20 0H228" stroke="#f59e0b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M0 11V-11M208 11V-11" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="104" y="-10" text-anchor="middle" fill="#f59e0b" stroke="none" font-family="Consolas, monospace" font-size="13">208.00</text>
  </g>

  <g fill="#91aabe" font-family="Consolas, monospace" font-size="11">
    <text x="70" y="303">DWG 01 / REV A</text>
    <text x="1130" y="303" text-anchor="end">FLORIDA, USA</text>
  </g>
</svg>
