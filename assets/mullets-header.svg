      <circle cx="510" cy="-5" r="4" filter="url(#glow)"/>
      <text x="526" y="0" fill="#8fb2c4" font-size="11" letter-spacing="2">CONNECTED</text>
    </g>
    <text x="0" y="84" fill="url(#metal)" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Mullets Aluminum</text>
    <rect x="2" y="108" width="112" height="5" rx="2.5" fill="#f59e0b"/>
    <text x="0" y="154" fill="#c5d3dd" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">PRODUCT ENGINEERING  /  AUTOMATION  /  OPERATIONAL DATA</text>

    <g transform="translate(0 196)" font-family="Consolas, monospace" font-size="11">
