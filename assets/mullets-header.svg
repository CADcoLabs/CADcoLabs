        <polygon points="22,199 31,192 325,192 316,199" fill="#e4edf3"/>
        <polygon points="316,199 325,192 325,208 316,215" fill="#60798b"/>
      </g>

      <g fill="#f59e0b">
        <circle cx="33" cy="220" r="4"/><circle cx="169" cy="220" r="4"/><circle cx="305" cy="220" r="4"/>
