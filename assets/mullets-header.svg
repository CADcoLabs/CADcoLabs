<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Mullets Aluminum</title>
  <desc id="desc">Industrial blueprint banner with an isometric aluminum railing assembly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset=".55" stop-color="#0b1d2e"/>
      <stop offset="1" stop-color="#12324a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#94a3b8"/>
      <stop offset=".7" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7ef"/>
      <stop offset="1" stop-color="#71899a"/>
    </linearGradient>
    <pattern id="minorGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#77a9c2" stroke-width=".5" opacity=".08"/>
    </pattern>
    <pattern id="majorGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#77a9c2" stroke-width="1" opacity=".12"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#f59e0b"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#minorGrid)"/>
  <rect width="1200" height="380" rx="20" fill="url(#majorGrid)"/>
  <path d="M0 326H1200" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="1080" cy="90" r="170" fill="#1f6687" opacity=".08"/>
  <circle cx="1080" cy="90" r="115" fill="none" stroke="#6ca6c1" stroke-width="1" opacity=".13"/>

  <g transform="translate(62 64)">
    <g fill="#f59e0b" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3">
