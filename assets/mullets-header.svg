          <polygon points="0,0 10,-8 32,-8 22,0" fill="#eef4f7"/>
        </g>
        <g transform="translate(294 46)">
          <rect width="22" height="190" fill="url(#rail)"/>
          <polygon points="22,0 32,-8 32,182 22,190" fill="#5f788b"/>
          <polygon points="0,0 10,-8 32,-8 22,0" fill="#eef4f7"/>
        </g>
      </g>

      <g fill="#93aaba" stroke="#d6e2e9" stroke-width="1">
        <rect x="63" y="46" width="8" height="163"/>
        <rect x="91" y="46" width="8" height="163"/>
        <rect x="119" y="46" width="8" height="163"/>
        <rect x="199" y="46" width="8" height="163"/>
        <rect x="227" y="46" width="8" height="163"/>
        <rect x="255" y="46" width="8" height="163"/>
      </g>

